<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- Test tube -->
  <g transform="translate(32 32) rotate(25)">
    <!-- Tube body -->
    <path
      d="M-5 -18 L5 -18 L5 12
         C5 18 2 22 0 22
         C-2 22 -5 18 -5 12 Z"
      fill="none"
      stroke="white"
      stroke-width="4"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Tube opening -->
    <line
      x1="-7"
      y1="-18"
      x2="7"
      y2="-18"
      stroke="white"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Liquid line -->
    <line
      x1="-3"
      y1="8"
      x2="3"
      y2="8"
      stroke="white"
      stroke-width="3"
      stroke-linecap="round"
    />
  </g>
</svg>